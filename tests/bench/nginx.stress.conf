# 测试 nginx：由线上 Hub 的 nginx 配置派生，只改 listen、证书与 upstream，另加计时日志。
# 线上为 nginx 1.18 + certbot 证书；这里用自签证书，监听 49992，转发到同一 docker 网络里的 hub-stress:3099。
# 保留线上的默认行为：proxy_request_buffering on、proxy_read/send_timeout 60s（线上未显式设置）。
user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
  worker_connections 10240;
}

# D 组对照「直连 Hub」：49993 只做 TLS 终止后按 TCP 原样转发，没有 HTTP 层的请求缓冲（线上没有这一段）
stream {
  server {
    listen 49993 ssl;
    ssl_certificate /etc/nginx/certs/stress.crt;
    ssl_certificate_key /etc/nginx/certs/stress.key;
    proxy_pass hub-stress:3099;
  }
}

http {
  sendfile on;
  tcp_nopush on;
  types_hash_max_size 2048;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  gzip on;

  log_format timing '$time_iso8601 $request_method $uri $status len=$request_length '
                    'rt=$request_time urt=$upstream_response_time uct=$upstream_connect_time';
  access_log /var/log/nginx/access.log timing;
  error_log /var/log/nginx/error.log warn;

  server {
    listen 49992 ssl;
    ssl_certificate /etc/nginx/certs/stress.crt;
    ssl_certificate_key /etc/nginx/certs/stress.key;

    client_max_body_size 100M;

    location / {
      proxy_pass http://hub-stress:3099/;

      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Real-PORT $remote_port;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /socket.io/ {
      proxy_pass http://hub-stress:3099;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_http_version 1.1;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Host $host;
    }
  }
}
